services:
  kinect-base:
    build:
      context: ./libs
      dockerfile: Dockerfile
    image: kinect-base

  app:
    container_name: kinect-app
    build:
      context: ./app
      dockerfile: Dockerfile
    image: kinect-app-rest
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    user: root
    depends_on:
      - kinect-base

  mongo:
    image: mongo:7.0.14
    container_name: sensor-data-mongo-db
    command: ["mongod"] 
    env_file:
        - .env
    volumes:
        - mongo_data:/data/db
    logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"


volumes:
  mongo_data:

  
