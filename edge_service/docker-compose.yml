version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - camera_service
      - detection_engine
    environment:
      - CAMERA_SERVICE_URL=http://camera_service:8001
      - DETECTION_SERVICE_URL=http://detection_engine:8002
    networks:
      - detection_network

  camera_service:
    build:
      context: .
      dockerfile: camera_service/Dockerfile

    devices:
      - /dev/video0:/dev/video0  # Webcam
    privileged: true
    networks:
      - detection_network

  detection_engine:
    build:
      context: .
      dockerfile: detection_engine/Dockerfile

    networks:
      - detection_network

networks:
  detection_network:
    driver: bridge
